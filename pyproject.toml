[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gcmrk"
version = "1.0.0"
description = "Genetic-algorithm clustering guided by performance-target metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luis Javier Madrigal-Roca" }]
keywords = ["clustering", "genetic-algorithm", "bioinformatics", "multi-objective"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
gcmrk = "gcmrk.cli:main"

[tool.setuptools]
packages = ["gcmrk"]
